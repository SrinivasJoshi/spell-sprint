<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <!-- Blacksmith's fonts (src/react-app/index.css, font-display: optional): fetched before the app's script so they are
         there for its first paint. -->
    <link rel="preload" href="/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply theme BEFORE React renders to prevent flash of unstyled content (FOUC)
      (function() {
        const storageKey = 'app-theme';
        const theme = localStorage.getItem(storageKey) || 'system';
        
        let actualTheme = theme;
        if (theme === 'system') {
          actualTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        
        document.documentElement.classList.add(actualTheme);
        
        // Apply background color immediately to prevent white/dark flash
        if (actualTheme === 'dark') {
          document.documentElement.style.backgroundColor = 'hsl(0 0% 3.9%)';
        } else {
          document.documentElement.style.backgroundColor = 'hsl(0 0% 96.1%)'; // --brand-background in index.css
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
